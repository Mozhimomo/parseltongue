services:
  mysql:
    image: mysql:8.4
    container_name: parseltongue-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: parseltongue
      MYSQL_USER: parseltongue
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - parseltongue_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -uroot']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  parseltongue_mysql_data:
