server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: ParseltongueGateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: arena-service
              uri: ${ARENA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/game/**
            - id: identity-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - '*'
                exposed-headers:
                  - X-Request-Id
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

gateway:
  auth:
    jwt-secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
